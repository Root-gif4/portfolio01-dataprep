[project]
name = "dataprep"
version = "1.0.0"
description = "業務データ処理ツール：CSV の整形・検証・重複検出・照合・集計（Portfolio 01）"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dataprep = "dataprep.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
